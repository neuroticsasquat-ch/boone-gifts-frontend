services:
  boone-gifts-frontend:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
      # The container's own node_modules (Linux binaries), not the host's.
      - node_modules:/app/node_modules
    # Traefik and the external `proxy` network come from the shared
    # tbc-localdev-infra stack (`task infra:up`). The browser calls the backend
    # (boone-gifts-backend, its own repo and compose project) directly at
    # VITE_API_URL, https://boone-gifts-api.localhost, so nothing here reaches
    # the api container. No published port: Traefik is the only route in.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.boone-gifts-web.rule=Host(`boone-gifts.localhost`)"
      - "traefik.http.routers.boone-gifts-web.entrypoints=websecure"
      - "traefik.http.routers.boone-gifts-web.tls=true"
      - "traefik.http.services.boone-gifts-web.loadbalancer.server.port=5173"
    # The SPA has no health route; Vite answering `/` is the readiness signal.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - proxy

volumes:
  node_modules:

networks:
  proxy:
    external: true
