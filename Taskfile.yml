version: '3'

# Traefik, Mailpit and the external `proxy` network are the shared
# tbc-localdev-infra stack; `task infra:up` starts it. Optional, so a checkout
# without it (CI) still loads every task that doesn't need it. The backend runs
# from its own repo (../boone-gifts-backend, `task up` there).
includes:
  infra:
    taskfile: ~/projects/tbc-localdev-infra/Taskfile.yml
    dir: ~/projects/tbc-localdev-infra
    optional: true

# Everything but the release tasks runs INSIDE the dev container, never on the
# host: the container's node_modules is the single toolchain.
vars:
  COMPOSE: docker compose
  SVC: boone-gifts-frontend
  EXEC: "{{.COMPOSE}} exec {{.SVC}}"

tasks:
  up:
    desc: Start the shared infra, then the frontend container (detached)
    cmds:
      - task: infra:up
      - "{{.COMPOSE}} up -d"

  down:
    desc: Stop and remove the frontend container (leaves the shared infra running)
    cmd: "{{.COMPOSE}} down"

  restart:
    desc: Restart the frontend container
    cmd: "{{.COMPOSE}} restart {{.SVC}}"

  # The named node_modules volume is filled from the image only when it is first
  # created, so a rebuilt image alone never reaches the running container. The
  # throwaway `npm ci` writes the new lockfile's packages into the volume.
  build:
    desc: Rebuild the image, sync deps into the node_modules volume, recreate the container
    cmds:
      - "{{.COMPOSE}} build"
      - "{{.COMPOSE}} run --rm --no-deps {{.SVC}} npm ci"
      - "{{.COMPOSE}} up -d"

  logs:
    desc: Follow the frontend container logs
    cmd: "{{.COMPOSE}} logs -f {{.SVC}}"

  shell:
    desc: Open a shell in the frontend container
    cmd: "{{.EXEC}} bash"

  ps:
    desc: Show compose service status
    cmd: "{{.COMPOSE}} ps"

  install:
    desc: Reinstall dependencies from the lock file into the running container
    cmd: "{{.EXEC}} npm ci"

  build:app:
    desc: Build for production (vite build)
    cmd: "{{.EXEC}} npx vite build"

  lint:
    desc: Run oxlint
    cmd: "{{.EXEC}} npx oxlint"

  typecheck:
    desc: Type-check the project (tsc -b, the first half of npm run build)
    cmd: "{{.EXEC}} npx tsc -b"

  test:
    desc: "Run the test suite (usage: task test [-- src/path/to/file.test.tsx])"
    cmd: "{{.EXEC}} npx vitest run {{.CLI_ARGS}}"

  test:watch:
    desc: Run tests in watch mode
    cmd: "{{.EXEC}} npx vitest {{.CLI_ARGS}}"

  deps:add:
    desc: "Add a package (usage: task deps:add -- <package>)"
    cmd: "{{.EXEC}} npm install {{.CLI_ARGS}}"

  deps:add-dev:
    desc: "Add a dev dependency (usage: task deps:add-dev -- <package>)"
    cmd: "{{.EXEC}} npm install -D {{.CLI_ARGS}}"

  deps:remove:
    desc: "Remove a package (usage: task deps:remove -- <package>)"
    cmd: "{{.EXEC}} npm uninstall {{.CLI_ARGS}}"

  # Release tasks run on the HOST, not in the container: git, git-cliff and gh
  # live here and the container has neither the remote nor the credentials.
  # That is why these tasks don't use {{.EXEC}}.

  release-branch:
    desc: "Cut the next release branch from the default branch (usage: task release-branch [-- --major|--minor|--patch])"
    silent: true
    cmd: |
      set -eu

      BUMP=minor
      case "{{.CLI_ARGS}}" in
        ""|--minor) ;;
        --major) BUMP=major ;;
        --patch) BUMP=patch ;;
        *) echo "unknown argument '{{.CLI_ARGS}}' -- expected --major, --minor or --patch" >&2; exit 1 ;;
      esac

      if ! git diff --quiet || ! git diff --cached --quiet; then
        echo "working tree is dirty -- commit or stash first" >&2; exit 1
      fi

      git fetch origin --prune --tags

      DEFAULT=$(git symbolic-ref --short refs/remotes/origin/HEAD 2>/dev/null | sed 's#^origin/##' || true)
      [ -n "$DEFAULT" ] || DEFAULT=main

      # No releases yet -> start from v0.0.0 so a minor bump gives v0.1.0.
      LATEST=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
      [ -n "$LATEST" ] || LATEST=v0.0.0
      V=${LATEST#v}
      case "$V" in
        [0-9]*.[0-9]*.[0-9]*) ;;
        *) echo "latest release '$LATEST' is not vMAJOR.MINOR.PATCH -- cut the branch by hand" >&2; exit 1 ;;
      esac
      MAJOR=${V%%.*}
      REST=${V#*.}
      MINOR=${REST%%.*}
      PATCH=${REST#*.}
      case "$BUMP" in
        major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
        minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
        patch) PATCH=$((PATCH + 1)) ;;
      esac
      NEXT="v$MAJOR.$MINOR.$PATCH"
      BRANCH="release/$NEXT"

      if git show-ref --verify --quiet "refs/heads/$BRANCH" || git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
        echo "$BRANCH already exists -- nothing to cut" >&2; exit 1
      fi

      git switch -c "$BRANCH" "origin/$DEFAULT"
      git push -u origin "$BRANCH"
      echo "cut $BRANCH from origin/$DEFAULT ($BUMP bump from $LATEST)"

  release-notes:
    desc: Regenerate RELEASE_NOTES.md for the current release and merge the PR into the release branch
    silent: true
    cmd: |
      set -eu

      if ! git diff --quiet || ! git diff --cached --quiet; then
        echo "working tree is dirty -- commit or stash first" >&2; exit 1
      fi

      git fetch origin --prune --tags

      DEFAULT=$(git symbolic-ref --short refs/remotes/origin/HEAD 2>/dev/null | sed 's#^origin/##' || true)
      [ -n "$DEFAULT" ] || DEFAULT=main

      # The release branch we're on, else the highest release branch not yet merged.
      RELEASE=$(git rev-parse --abbrev-ref HEAD)
      case "$RELEASE" in
        release/v*) ;;
        *) RELEASE=$(git branch -r --no-merged "origin/$DEFAULT" --list 'origin/release/v*' | sed 's#^[* ]*origin/##' | sort -V | tail -1) ;;
      esac
      [ -n "$RELEASE" ] || { echo "no release/v* branch found -- run 'task release-branch' first" >&2; exit 1; }

      # release/v0.5.0 -> v0.5.0. The branch name is the version; nothing else tracks it.
      VERSION=${RELEASE#release/}
      WORK="docs/release-notes-$VERSION"

      if git show-ref --verify --quiet "refs/heads/$WORK"; then
        echo "$WORK already exists -- finish or delete that branch first" >&2; exit 1
      fi

      git switch -c "$WORK" "origin/$RELEASE"
      git cliff --tag "$VERSION" -u --prepend RELEASE_NOTES.md

      if git diff --quiet -- RELEASE_NOTES.md; then
        echo "no unreleased commits since the last tag -- nothing to write"
        git switch -
        git branch -D "$WORK"
        exit 0
      fi

      git add RELEASE_NOTES.md
      git commit -m "docs(release-notes): add $VERSION notes"
      git push -u origin "$WORK"

      PR=$(gh pr create --base "$RELEASE" --head "$WORK" \
        --title "docs(release-notes): add $VERSION notes" \
        --body "Release notes for $VERSION, generated by git cliff via 'task release-notes'.")
      echo "opened $PR"

      # A check run can take minutes to register; --watch returns immediately when
      # none exist yet, so wait for one to appear before watching it.
      echo "waiting for CI to register..."
      for i in $(seq 1 20); do
        if OUT=$(gh pr checks "$PR" 2>&1); then
          break
        fi
        case "$OUT" in
          *"no checks reported"*) sleep 30 ;;
          *) break ;;
        esac
      done

      if command -v timeout >/dev/null 2>&1; then
        WATCH="timeout 1800 gh"
      else
        WATCH=gh
      fi
      if ! $WATCH pr checks "$PR" --watch --fail-fast --interval 10; then
        echo "CI did not pass -- $PR left open, nothing merged" >&2; exit 1
      fi

      if git show-ref --verify --quiet "refs/heads/$RELEASE"; then
        git switch "$RELEASE"
      else
        git switch -c "$RELEASE" "origin/$RELEASE"
      fi
      gh pr merge "$PR" --squash --delete-branch
      git pull --ff-only origin "$RELEASE"
      git branch -D "$WORK" 2>/dev/null || true
      echo "merged $PR into $RELEASE"
